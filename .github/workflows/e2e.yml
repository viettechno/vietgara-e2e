name: E2E

# The test job itself. It runs on every pull request that touches the suite
# (with the newest release images) and is reused by the manual workflow
# ".github/workflows/e2e-manual.yml", which lets you pick the versions to test.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/e2e-manual.yml'
      - 'playwright.config.ts'
      - 'package.json'
  workflow_call:
    inputs:
      backend_tag:
        description: 'vietgara-backend image tag (empty: the newest release tag)'
        type: string
        default: ''
      owner_web_tag:
        description: 'vietgara-owner-web image tag (empty: the newest release tag)'
        type: string
        default: ''
      admin_web_tag:
        description: 'vietgara-admin-web image tag (empty: the newest release tag)'
        type: string
        default: ''
      web_base_url:
        description: 'Test an environment that is already running instead of starting the stack (tags are ignored)'
        type: string
        default: ''
      grep:
        description: 'Only run tests whose title matches this pattern (empty: all)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEB_BASE_URL: ${{ inputs.web_base_url || 'http://localhost:8000' }}
      EXISTING_ENV: ${{ (inputs.web_base_url || '') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The full stack (Postgres, Redis, Kafka, Mailpit, backend, both web apps,
      # Kong) runs from the PUBLISHED images (ghcr.io/viettechno/*, public), so
      # no source repository is cloned and no registry login is needed. See
      # ci/compose.yml. Skipped when web_base_url points at a running environment.
      - name: Resolve and check the image tags
        if: ${{ env.EXISTING_ENV != 'true' }}
        env:
          REQUESTED_BACKEND: ${{ inputs.backend_tag }}
          REQUESTED_OWNER_WEB: ${{ inputs.owner_web_tag }}
          REQUESTED_ADMIN_WEB: ${{ inputs.admin_web_tag }}
        run: |
          backend=$(ci/resolve-tag.sh vietgara-backend "$REQUESTED_BACKEND")
          owner_web=$(ci/resolve-tag.sh vietgara-owner-web "$REQUESTED_OWNER_WEB")
          admin_web=$(ci/resolve-tag.sh vietgara-admin-web "$REQUESTED_ADMIN_WEB")
          ci/check-tag.sh vietgara-backend "$backend"
          ci/check-tag.sh vietgara-owner-web "$owner_web"
          ci/check-tag.sh vietgara-admin-web "$admin_web"
          {
            echo "BACKEND_TAG=$backend"
            echo "OWNER_WEB_TAG=$owner_web"
            echo "ADMIN_WEB_TAG=$admin_web"
          } | tee -a "$GITHUB_ENV"

      - name: Start the stack
        if: ${{ env.EXISTING_ENV != 'true' }}
        run: docker compose -f ci/compose.yml up -d --wait

      - name: Wait for the web app
        run: npx wait-on ${{ env.WEB_BASE_URL }} -t 120000

      - name: Run the suite
        env:
          API_BASE_URL: ${{ env.WEB_BASE_URL }}/api
          MAILPIT_URL: http://localhost:8025
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
          GREP: ${{ inputs.grep }}
        run: |
          args=(--reporter=github,html,json)
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test "${args[@]}"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          GREP: ${{ inputs.grep }}
        run: |
          {
            echo "## E2E result"
            echo
            if [ "$EXISTING_ENV" = "true" ]; then
              echo "Target: an existing environment, \`$WEB_BASE_URL\`"
            else
              echo "| App | Image tag | Digest |"
              echo "| --- | --- | --- |"
              for row in "vietgara-backend:$BACKEND_TAG" "vietgara-owner-web:$OWNER_WEB_TAG" "vietgara-admin-web:$ADMIN_WEB_TAG"; do
                pkg=${row%%:*}; tag=${row#*:}
                digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/viettechno/$pkg:$tag" 2>/dev/null | sed 's/.*@//' || true)
                echo "| \`$pkg\` | \`$tag\` | \`${digest:-n/a}\` |"
              done
            fi
            echo
            echo "Scenarios: \`${GREP:-all}\`"
            echo
            if [ -f test-results/results.json ]; then
              jq -r '"| Passed | Failed | Flaky | Skipped |\n| --- | --- | --- | --- |\n| \(.stats.expected) | \(.stats.unexpected) | \(.stats.flaky) | \(.stats.skipped) |"' test-results/results.json
              failed=$(jq -r '[.. | objects | select(has("specs")) | .specs[] | select(.ok == false) | .title] | .[]' test-results/results.json)
              if [ -n "$failed" ]; then echo; echo "Failed scenarios:"; echo "$failed" | sed 's/^/- /'; fi
            else
              echo "The suite did not produce a result file (it did not start, or crashed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stack logs
        if: ${{ failure() && env.EXISTING_ENV != 'true' }}
        run: docker compose -f ci/compose.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/results.json
          retention-days: 14

  smoke:
    # Fast @smoke gate on every pull request: same setup and stack as `e2e`
    # but runs only the @smoke-tagged subset (`npm run test:smoke`). The
    # full suite stays on `e2e`; the nightly split is a later item.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEB_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Same published-image stack as `e2e` (see ci/compose.yml); newest
      # release tags, since a pull_request event carries no version inputs.
      - name: Resolve and check the image tags
        run: |
          backend=$(ci/resolve-tag.sh vietgara-backend "")
          owner_web=$(ci/resolve-tag.sh vietgara-owner-web "")
          admin_web=$(ci/resolve-tag.sh vietgara-admin-web "")
          ci/check-tag.sh vietgara-backend "$backend"
          ci/check-tag.sh vietgara-owner-web "$owner_web"
          ci/check-tag.sh vietgara-admin-web "$admin_web"
          {
            echo "BACKEND_TAG=$backend"
            echo "OWNER_WEB_TAG=$owner_web"
            echo "ADMIN_WEB_TAG=$admin_web"
          } | tee -a "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose -f ci/compose.yml up -d --wait

      - name: Wait for the web app
        run: npx wait-on ${{ env.WEB_BASE_URL }} -t 120000

      - name: Run the smoke suite
        env:
          API_BASE_URL: ${{ env.WEB_BASE_URL }}/api
          MAILPIT_URL: http://localhost:8025
          CI: true
        run: npm run test:smoke

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose -f ci/compose.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 14
