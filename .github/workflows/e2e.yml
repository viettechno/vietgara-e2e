name: E2E

on:
  workflow_dispatch:
    inputs:
      web_base_url:
        description: 'Test an environment that is already running (e.g. staging) instead of starting the stack'
        required: false
        default: ''
      backend_tag:
        description: 'vietgara-backend image tag (default: the newest release tag on ghcr.io)'
        required: false
        default: ''
      owner_web_tag:
        description: 'vietgara-owner-web image tag (default: the newest release tag)'
        required: false
        default: ''
      admin_web_tag:
        description: 'vietgara-admin-web image tag (default: the newest release tag)'
        required: false
        default: ''
  # Uncomment once a staging environment is reachable from CI runners:
  # schedule:
  #   - cron: '0 2 * * *' # nightly, matching Test Strategy's "before every release" cadence
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/e2e.yml'
      - 'playwright.config.ts'
      - 'package.json'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_BASE_URL: ${{ github.event.inputs.web_base_url || 'http://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The full stack (Postgres, Redis, Kafka, Mailpit, backend, both web apps,
      # Kong) runs from the PUBLISHED images (ghcr.io/viettechno/*, public), so
      # no source repository is cloned and no registry login is needed. See
      # ci/compose.yml. Skipped when web_base_url points at a running environment.
      - name: Resolve image tags
        if: ${{ github.event.inputs.web_base_url == '' }}
        env:
          REQUESTED_BACKEND: ${{ github.event.inputs.backend_tag }}
          REQUESTED_OWNER_WEB: ${{ github.event.inputs.owner_web_tag }}
          REQUESTED_ADMIN_WEB: ${{ github.event.inputs.admin_web_tag }}
        run: |
          {
            echo "BACKEND_TAG=$(ci/resolve-tag.sh vietgara-backend "$REQUESTED_BACKEND")"
            echo "OWNER_WEB_TAG=$(ci/resolve-tag.sh vietgara-owner-web "$REQUESTED_OWNER_WEB")"
            echo "ADMIN_WEB_TAG=$(ci/resolve-tag.sh vietgara-admin-web "$REQUESTED_ADMIN_WEB")"
          } | tee -a "$GITHUB_ENV"

      - name: Start the stack
        if: ${{ github.event.inputs.web_base_url == '' }}
        run: docker compose -f ci/compose.yml up -d --wait

      - name: Wait for the web app
        run: npx wait-on ${{ env.WEB_BASE_URL }} -t 120000

      - name: Run the suite
        run: npm test
        env:
          API_BASE_URL: ${{ env.WEB_BASE_URL }}/api
          MAILPIT_URL: http://localhost:8025
          CI: true

      - name: Stack logs
        if: ${{ failure() && github.event.inputs.web_base_url == '' }}
        run: docker compose -f ci/compose.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
