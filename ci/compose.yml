# The full VietGara stack for the E2E suite, from the PUBLISHED images
# (ghcr.io/viettechno/*): no source checkout, no build, no registry login.
#
#   BACKEND_TAG / OWNER_WEB_TAG / ADMIN_WEB_TAG  image tags (see ci/resolve-tag.sh)
#   KONG_PROXY_PORT / MAILPIT_UI_PORT / PG_PORT  host ports (default 8000 / 8025 / 15432)
#
# Derived from vietgara-backend/docker-compose.yml (the local development
# stack, which builds from source). Values here are throw-away CI values.

name: vietgara-e2e

services:
  pgsql:
    image: postgres:18.4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vietgara
    # Published on loopback for the time-shifting setup helpers of the
    # subscription and invitation scenarios (src/fixtures/timeshift.ts).
    ports:
      - '127.0.0.1:${PG_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d vietgara']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Catches every e-mail the backend sends: the suite reads OTP codes from its API.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  backend:
    image: ghcr.io/viettechno/vietgara-backend:${BACKEND_TAG:?set BACKEND_TAG}
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      RUN_MIGRATIONS: 'true'
      MIGRATION_DATABASE_URL: postgres://user:password@pgsql:5432/vietgara?sslmode=disable
      APP_DB_USER: vietgara_local
      APP_DB_PASSWORD: vietgara_local
      DATABASE_URL: postgres://vietgara_local:vietgara_local@pgsql:5432/vietgara?sslmode=disable
      JWT_SIGNING_KEY: e9566ea0d177b875acafa818ceece3dc86a98a2e827d2d9123eea9edc294347d # CI-only, never used outside this throw-away stack
      # Encrypts the TOTP secrets of the optional two-step verification (E2E-IAM-022 to 025).
      MFA_ENCRYPTION_KEY: 3c1f6a9b2d4e7081a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c # CI-only, never used outside this throw-away stack
      JWT_ACCESS_TTL: 20m
      JWT_REFRESH_TTL: 720h
      GRPC_PORT: 50051
      HTTP_PORT: 8080
      API_DOCS_ENABLED: 'false'
      APP_BASE_URL: http://localhost:${KONG_PROXY_PORT:-8000}
      PLATFORM_ADMIN_EMAILS: admin@vietgara.test
      REDIS_ADDR: redis:6379
      # Short, so the period-end and grace-end scenarios (E2E-LIC-010/011)
      # wait seconds, not the production-like defaults of 1h / 5m.
      ENTITLEMENT_CACHE_TTL: 1s
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PREFIX: vietgara
      KAFKA_CONSUMER_GROUP: vietgara-backend
      OUTBOX_RELAY_INTERVAL: 1s
      LICENSE_EXPIRY_JOB_INTERVAL: 5s
      MAIL_PROVIDER: smtp
      MAIL_FROM_ADDRESS: no-reply@vietgara.test
      MAIL_FROM_NAME: VietGara
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/uploads
    # The image carries its own HEALTHCHECK (/healthz), which `docker compose up --wait` uses.

  owner-web:
    image: ghcr.io/viettechno/vietgara-owner-web:${OWNER_WEB_TAG:?set OWNER_WEB_TAG}

  admin-web:
    image: ghcr.io/viettechno/vietgara-admin-web:${ADMIN_WEB_TAG:?set ADMIN_WEB_TAG}

  # The single entry point: the web app at / and the API at /api.
  gateway:
    image: kong:3.9
    depends_on:
      - backend
      - owner-web
      - admin-web
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_LOG_LEVEL: warn
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 8m
      # Gateway errors (a 429 from the rate limits) use the API's error envelope.
      KONG_ERROR_TEMPLATE_JSON: /etc/kong/error.json
      KONG_ERROR_DEFAULT_TYPE: application/json
    ports:
      - '127.0.0.1:${KONG_PROXY_PORT:-8000}:8000'
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
      - ./error.json:/etc/kong/error.json:ro
